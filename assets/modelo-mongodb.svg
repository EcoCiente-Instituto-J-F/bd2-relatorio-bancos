<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc"><title id="title">MongoDB · sessões e memória de usuários</title><desc id="desc">O usuário se relaciona às coleções sessoes e memoria_usuarios pelo campo usuario_id. Cada sessão contém mensagens embutidas.</desc><rect width="1540" height="900" rx="18" fill="#f7f3f0" /><text x="50" y="62" font-family="Georgia, serif" fill="#0f1723" font-size="36" font-weight="600">MongoDB · sessões e memória</text><text x="50" y="96" font-family="Segoe UI, Arial, sans-serif" fill="#425a57" font-size="18">Duas coleções por usuário; as mensagens ficam dentro da sessão.</text><path d="M340 443 C410 440 438 298 501 298" fill="none" stroke="#177456" stroke-width="3" /><polygon points="501,298 488.0,303.2 488.0,292.8" fill="#177456" /><path d="M340 491 C411 514 445 685 501 685" fill="none" stroke="#177456" stroke-width="3" /><polygon points="501,685 488.0,690.2 488.0,679.8" fill="#177456" /><path d="M885 298 C953 298 997 298 1046 298" fill="none" stroke="#177456" stroke-width="3" /><polygon points="1046,298 1033.0,303.2 1033.0,292.8" fill="#177456" /><g><rect x="80" y="388" width="260" height="150" rx="16" fill="#fff" stroke="#bfd0c3" stroke-width="1.6" /><path d="M96 388H324A16 16 0 0 1 340 404V450H80V404A16 16 0 0 1 96 388" fill="#e8eee8" /><text x="100" y="413" font-family="Segoe UI, Arial, sans-serif" fill="#4d7261" font-size="13" font-weight="700" letter-spacing=".08em">IDENTIDADE</text><text x="100" y="438" font-family="Segoe UI, Arial, sans-serif" fill="#064e3b" font-size="23" font-weight="700">Usuário</text><text x="101" y="488" font-family="Consolas, monospace" fill="#29483b" font-size="17">usuario_id</text></g><g><rect x="510" y="150" width="375" height="290" rx="16" fill="#fff" stroke="#bfd0c3" stroke-width="1.6" /><path d="M526 150H869A16 16 0 0 1 885 166V212H510V166A16 16 0 0 1 526 150" fill="#e8eee8" /><text x="530" y="175" font-family="Segoe UI, Arial, sans-serif" fill="#4d