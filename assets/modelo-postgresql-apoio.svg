<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 417" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL · Tabelas de apoio</title><desc id="desc">Chaves primárias e 0 chaves estrangeiras de 2 tabelas. Cada seta sai da coluna FK e aponta para a tabela e a coluna referenciadas.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#075540" stroke-width="1.8"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.title{font:700 31px Georgia,serif;fill:#073f35}.sub{font-size:17px;fill:#46645a}.col{font-size:15px;font-weight:700;letter-spacing:.09em;fill:#527369}.name{font-size:18px;font-weight:700;fill:#064e3b}.pk{font-size:15px;fill:#52675e}.field{font-size:16px;fill:#223b34}.ref{font-size:16px;font-weight:600;fill:#124b3b}.sourcebox{fill:#fff;stroke:#bbd0c4;stroke-width:1.5}.targetbox{fill:#e9f1e9;stroke:#b3cdbb;stroke-width:1.2}.line{stroke:#075540;stroke-width:2;fill:none}.divider{stroke:#e1eae1;stroke-width:1}</style><rect width="1460" height="417" rx="18" fill="#f7f3f0"/><text x="52" y="55" class="title">Tabelas de apoio</text><text x="52" y="86" class="sub">2 tabelas · 0 relações por chave estrangeira</text><text x="52" y="112" class="sub">Tabelas definidas no esquema SQL do populador</text><text x="72" y="148" class="col">TABELA E COLUNA FK</text><text x="850" y="148" class="col">TABELA E COLUNA REFERENCIADA</text><g aria-label="tb_metricas_dau"><rect class="sourcebox" x="52" y="163" width="605" height="98" rx="13"/><rect x="53" y="164" width="603" height="41" rx="12" fill="#e7eee7"/><text x="72" y="190" class="name">tb_metricas_dau</text><text x="638" y="190" class="pk" text-anchor="end">PK data_referencia</text><text x="73" y="233" class="pk">Sem chave estrangeira de saída</text></g><g aria-label="tb_migracao_ids_map"><rect class="sourcebox" x="52" y="277" width="605" height="98" rx="13"/><rect x="53" y="278" width="603" height="41" rx="12" fill="#e7eee7"/><text x="72" y="304" class="name">tb_migracao_ids_map</text><text x="638" y="304" class="pk" text-anchor="end">PK entidade,legacy_id</text><text x="73" y="347" class="pk">Sem chave estrangeira de saída</text></g></svg>