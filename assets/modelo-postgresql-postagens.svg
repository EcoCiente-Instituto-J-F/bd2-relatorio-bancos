f">tb_lkp_categorias_residuos</text><text x="1390" y="232" class="pk" text-anchor="end">id_categoria</text><path class="divider" d="M72 248H638"/><text x="73" y="275" class="field">FK condominio_id</text><path class="line" d="M657 270H816" marker-end="url(#arrow)"/><rect class="targetbox" x="832" y="250" width="574" height="38" rx="9"/><text x="848" y="275" class="ref">tb_condominios</text><text x="1390" y="275" class="pk" text-anchor="end">id_condominio</text><path class="divider" d="M72 291H638"/><text x="73" y="318" class="field">FK status_validacao_id</text><path class="line" d="M657 313H816" marker-end="url(#arrow)"/><rect class="targetbox" x="832" y="293" width="574" height="38" rx="9"/><text x="848" y="318" class="ref">tb_lkp_status_validacoes_postagens</text><text x="1390" y="318" class="pk" text-anchor="end">id_status_validacao</text><path class="divider" d="M72 334H638"/><text x="73" y="361" class="field">FK torre_id</text><path class="line" d="M657 356H816" marker-end="url(#arrow)"/><rect class="targetbox" x="832" y="336" width="574" height="38" rx="9"/><text x="848" y="361" class="ref">tb_torres</text><text x="1390" y="361" class="pk" text-anchor="end">id_torre</text><path class="divider" d="M72 377H638"/><text x="73" y="404" class="field">FK usuario_id</text><path class="line" d="M657 399H816" marker-end="url(#arrow)"/><rect class="targetbox" x="832" y="379" width="574" height="38" rx="9"/><text x="848" y="404" class="ref">tb_usuarios</text><text x="1390" y="404" class="pk" text-anchor="end">id_usuario</text></g><g aria-label="tb_rel_votos_postagens"><rect class="sourcebox" x="52" y="449" width="605" height="227" rx="13"/><rect x="53" y="450" width="603" height="41" rx="12" fill="#e7eee7"/><text x="72" y="476" class="name">tb_rel_votos_postagens</text><text x="638" y="476" class="pk" text-anchor="end">PK id_voto</text><text x="73" y="518" class="field">FK motivo_denuncia_id</text><path class="line" d="M657 513H816" marker-end="url(#arrow)"/><rect class=